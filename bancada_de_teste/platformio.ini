; PlatformIO Project Configuration File
; Projeto: Bancada de Teste Multi-Plataforma
; Microcontroladores: ESP32 DevKit, Arduino Nano, Arduino Mega 2560
;
; Mais informações e documentação:
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev
description = Bancada de Teste compatível com ESP32, Arduino Nano e Arduino Mega 2560

; Configurações comuns a todos os ambientes
[env]
framework = arduino
monitor_speed = 115200
monitor_filters = time, send_on_enter

; =====================================================================
; 1. AMBIENTE ESP32 (DevKit v1 / WROOM-32)
; =====================================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
upload_port = COM3
monitor_port = COM3
build_flags = 
    -D PLACA_ESP32
    -D MONITOR_BAUD=115200

; =====================================================================
; 2. AMBIENTE ARDUINO NANO (Bootloader Antigo - Padrão em clones CH340)
; =====================================================================
[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
upload_port = COM5
monitor_port = COM5
build_flags = 
    -D PLACA_NANO
    -D MONITOR_BAUD=115200
lib_deps = 
    feilipu/FreeRTOS @ ^11.1.0-3

; =====================================================================
; 2.1 AMBIENTE ARDUINO NANO (Bootloader Novo - Placas oficiais ou recentes)
; =====================================================================
[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
upload_port = COM5
monitor_port = COM5
build_flags = 
    -D PLACA_NANO
    -D MONITOR_BAUD=115200
lib_deps = 
    feilipu/FreeRTOS @ ^11.1.0-3

; =====================================================================
; 3. AMBIENTE ARDUINO MEGA 2560
; =====================================================================
[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
build_flags = 
    -D PLACA_MEGA
    -D MONITOR_BAUD=115200
lib_deps = 
    feilipu/FreeRTOS @ ^11.1.0-3
