; PlatformIO Project Configuration File
; Projeto: Bancada
; Microcontroladores: Arduino Nano (ATmega328P) e Arduino Mega 2560
; Baud Rate: 9600 bps

[platformio]
default_envs = nanoatmega328
description = Bancada com FreeRTOS para Arduino Nano e Arduino Mega 2560 (9600 baud)

; Configurações comuns a todos os ambientes
[env]
platform = atmelavr
framework = arduino
monitor_speed = 9600
monitor_filters = time, send_on_enter
lib_deps = 
    feilipu/FreeRTOS @ ^11.1.0-3

; =====================================================================
; 1. AMBIENTE ARDUINO NANO (Bootloader Antigo - Comum em clones CH340)
; =====================================================================
[env:nanoatmega328]
board = nanoatmega328
build_flags = 
    -D PLACA_NANO
    -D MONITOR_BAUD=9600

; =====================================================================
; 2. AMBIENTE ARDUINO NANO (Bootloader Novo - Placas oficiais ou recentes)
; =====================================================================
[env:nanoatmega328new]
board = nanoatmega328new
build_flags = 
    -D PLACA_NANO
    -D MONITOR_BAUD=9600

; =====================================================================
; 3. AMBIENTE ARDUINO MEGA 2560
; =====================================================================
[env:megaatmega2560]
board = megaatmega2560
build_flags = 
    -D PLACA_MEGA
    -D MONITOR_BAUD=9600

